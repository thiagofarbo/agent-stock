spring.application.name=agent-flight
cv.openai.api-key=${OPENAI_API_KEY}
cv.openai.model-name=gpt-4.1-mini
apify.token=${APIFY_TOKEN}


stockdata.api-token=${STOCKDATA_API_TOKEN:}

# Cache semantico: a conexao e criada quando o bean SemanticCache e utilizado.
semantic-cache.redis.host=${REDIS_HOST:localhost}
semantic-cache.redis.port=${REDIS_PORT:6379}
semantic-cache.redis.index=${SEMANTIC_CACHE_INDEX:semantic-cache-stock-v2-1536}
semantic-cache.redis.prefix=${SEMANTIC_CACHE_PREFIX:semantic-cache:stock-v2-1536:}
semantic-cache.embedding.model=${SEMANTIC_CACHE_EMBEDDING_MODEL:text-embedding-3-small}
semantic-cache.embedding.dimension=${SEMANTIC_CACHE_EMBEDDING_DIMENSION:1536}
semantic-cache.min-score=${SEMANTIC_CACHE_MIN_SCORE:0.9}

stock.cache.ttl=${STOCK_CACHE_TTL:60s}
